{% extends "layout.html" %}

{% block content %}

<h1>name: {{level.name}}</h1>
<h2>placement: {{level.placement}}</h2>
<h2>Verifier: {{level.verifier.name}}</h2>
<h2>Publisher: {{level.publisher.name}}</h2>
<br>
<h2>Victors:</h2>

{% for completion in level.level_completions %}
<h3><a href="/leaderboard/{{completion.player.id}}">{{completion.player.name}}</a></h3>
{% endfor %}

{% endblock %}
